# .github/workflows/extract-uikitcore.yml
#
# Downloads an Apple-signed IPSW directly from Apple's CDN (via the URL you
# supply) and extracts UIKitCore from the dyld shared cache using the
# `blacktop/ipsw` CLI, then uploads just that one framework binary as a
# build artifact. Runs entirely on GitHub's Linux runner -- nothing touches
# your Windows machine except the final small download.
#
# Usage: trigger manually (workflow_dispatch) and paste in the direct IPSW
# URL from ipsw.me's "Download" button for your exact build.

name: Extract UIKitCore from IPSW

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'Direct Apple CDN URL to the .ipsw file (from ipsw.me)'
        required: true
        type: string
      framework_path:
        description: 'Path inside the shared cache to extract'
        required: false
        type: string
        default: '/System/Library/PrivateFrameworks/UIKitCore.framework/UIKitCore'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          # IPSWs are ~9-10GB and the shared cache extraction needs
          # working room too -- default runner disk is tight for this.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install download + ipsw tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 jq

          # blacktop/ipsw releases are versioned filenames, not a static
          # "latest" URL -- e.g. ipsw_3.1.658_linux_x86_64.tar.gz. Query the
          # GitHub API for the real current tag/version first (this call
          # doesn't need auth for a public repo's releases), then build the
          # matching asset URL from that, per their documented install
          # pattern (https://blacktop.github.io/ipsw/docs/getting-started/installation/).
          IPSW_VERSION=$(curl -s https://api.github.com/repos/blacktop/ipsw/releases/latest \
            | jq -r '.tag_name' | tr -d 'v')
          echo "Resolved ipsw CLI version: $IPSW_VERSION"
          if [ -z "$IPSW_VERSION" ] || [ "$IPSW_VERSION" = "null" ]; then
            echo "::error::Failed to resolve blacktop/ipsw latest release tag from GitHub API"
            exit 1
          fi

          ASSET_URL="https://github.com/blacktop/ipsw/releases/download/v${IPSW_VERSION}/ipsw_${IPSW_VERSION}_linux_x86_64.tar.gz"
          echo "Downloading: $ASSET_URL"
          curl -sL -o ipsw.tar.gz "$ASSET_URL"

          # Fail loudly here instead of letting a bad download reach tar as
          # garbage input (which is what produced the "not in gzip format"
          # error last time -- curl -sL silently saves a 404/error page as
          # if it were the real file).
          file ipsw.tar.gz
          if ! file ipsw.tar.gz | grep -qi 'gzip compressed'; then
            echo "::error::Downloaded file is not a gzip archive -- asset URL may be wrong. Check https://github.com/blacktop/ipsw/releases for the current filename pattern."
            head -c 500 ipsw.tar.gz
            exit 1
          fi

          tar -xzf ipsw.tar.gz
          chmod +x ipsw
          sudo mv ipsw /usr/local/bin/ipsw
          ipsw version

      - name: Build and install apfs-fuse
        run: |
          # ipsw needs apfs-fuse on PATH to mount the extracted APFS system
          # volume DMG -- it's not in Ubuntu's apt repos, so build the small
          # upstream project from source.
          #
          # NOTE: the actual mount binary (apfsfuse/ApfsFuse.cpp) includes
          # <fuse3/fuse.h> -- it needs libfuse3-dev, not libfuse-dev (FUSE2).
          # Installing the wrong one lets everything except apfs-fuse itself
          # build (apfsutil/apfs-dump/apfs-dump-quick don't touch FUSE
          # headers), which is why the first attempt got 98% through before
          # failing specifically on the one binary we actually need.
          sudo apt-get install -y -qq \
            fuse3 libfuse3-dev cmake build-essential \
            libattr1-dev zlib1g-dev libbz2-dev

          # The first attempt's apt log showed fuse3 getting silently
          # removed as a side effect of installing the wrong (FUSE2)
          # package -- confirm fuse3 userspace tooling actually landed
          # this time before spending build time on apfs-fuse itself.
          which fusermount3 || { echo "::error::fusermount3 not found after installing fuse3 -- FUSE3 userspace may not be set up correctly"; exit 1; }

          git clone --depth 1 https://github.com/sgan81/apfs-fuse.git
          cd apfs-fuse
          git submodule update --init --recursive
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"
          sudo cp apfs-fuse /usr/local/bin/
          sudo cp apfsutil /usr/local/bin/ 2>/dev/null || true
          apfs-fuse --help || true
          cd ../..

      - name: Download IPSW
        run: |
          # aria2c opens multiple parallel connections to the same file and
          # auto-retries/resumes on drops -- this is what actually improves
          # speed/stability against Apple's CDN, not a GitHub token (which
          # Apple's servers don't recognize and has nothing to do with this
          # download -- GITHUB_TOKEN only authenticates calls back to
          # GitHub's own API, e.g. creating releases or checking out repos).
          aria2c -x 16 -s 16 -k 1M --retry-wait=5 --max-tries=0 \
            --file-allocation=falloc \
            -o firmware.ipsw \
            "${{ inputs.ipsw_url }}"
          ls -lh firmware.ipsw

      - name: Extract dyld_shared_cache from IPSW
        run: |
          # GitHub's Ubuntu runners are full VMs (not containers), so
          # /dev/fuse should already exist -- verify rather than assume, so
          # a missing device node fails clearly here instead of surfacing
          # as a confusing mount error three steps of output later.
          ls -l /dev/fuse || { echo "::error::/dev/fuse not present on this runner"; exit 1; }

          ipsw extract --dyld firmware.ipsw

          # ipsw writes output into a build-identifier-named subdirectory
          # (e.g. 23F84__iPhone14,7/), not the current directory -- confirmed
          # from the actual run output ("Created 23F84__iPhone14,7/dyld_shared_cache_arm64e...").
          # Find it dynamically rather than assuming a flat layout or
          # hardcoding this run's specific build string.
          CACHE_DIR=$(dirname "$(find . -name 'dyld_shared_cache_arm64e' -not -name '*.*' | head -n1)")
          if [ -z "$CACHE_DIR" ] || [ "$CACHE_DIR" = "." ]; then
            echo "::error::Could not locate dyld_shared_cache_arm64e output directory"
            find . -iname 'dyld_shared_cache*'
            exit 1
          fi
          echo "Found shared cache dir: $CACHE_DIR"
          echo "CACHE_DIR=$CACHE_DIR" >> "$GITHUB_ENV"
          ls -lh "$CACHE_DIR"/dyld_shared_cache_arm64e*

      - name: Split out individual framework from shared cache
        run: |
          MAIN_CACHE="$CACHE_DIR/dyld_shared_cache_arm64e"
          if [ ! -f "$MAIN_CACHE" ]; then
            echo "::error::Expected main cache file not found: $MAIN_CACHE"
            ls -la "$CACHE_DIR"
            exit 1
          fi
          echo "Using cache: $MAIN_CACHE"
          ipsw dyld extract "$MAIN_CACHE" "${{ inputs.framework_path }}" --output extracted/
          ls -lh extracted/

      - name: Upload UIKitCore artifact
        uses: actions/upload-artifact@v4
        with:
          name: UIKitCore
          path: extracted/*
          retention-days: 3
